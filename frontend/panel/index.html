<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cosigna</title>
  <link rel="icon" type="image/png" href="/logo.png" />
  <!-- SDK para firmar las aprobaciones en el navegador (el usuario nunca ve esto) -->
  <script src="https://cdn.jsdelivr.net/npm/@stellar/stellar-sdk@13.3.0/dist/stellar-sdk.min.js"></script>
</head>
<body>
  <div class="app-wrapper">
    <!-- Chrome del template: este bloque es de jQuery, Vue no lo toca -->
    <nav class="app-header">
      <button id="btn-menu" class="btn-menu" aria-label="Menú">&#9776;</button>
      <a class="marca" href="#/"><img class="marca-logo" src="/logo.png" alt="Cosigna" />Cosigna</a>
      <span class="header-nota">Tesorerías colectivas con aprobación compartida</span>
    </nav>

    <aside class="app-sidebar">
      <div class="sidebar-titulo">Funcional</div>
      <a class="sidebar-link" href="#/">Cajas</a>
      <a class="sidebar-link" href="#/mis-cajas">Mis cajas</a>
      <a class="sidebar-link" href="#/acceso">Acceso</a>
      <div class="sidebar-titulo mt-3">Configuración</div>
      <a class="sidebar-link sidebar-sub" href="#/config/admins">Administradores</a>
      <a class="sidebar-link sidebar-sub" href="#/config/cajas">Cajas</a>
      <a class="sidebar-link sidebar-sub" href="#/config/usuarios">Usuarios</a>
      <a class="sidebar-link sidebar-sub" href="#/config/organizacion">Organización</a>
      <a class="sidebar-link sidebar-sub" id="link-organizaciones" href="#/config/organizaciones" style="display:none">Organizaciones</a>
      <div class="sidebar-titulo mt-3" id="sidebar-titulo-cajas">Cajas recientes</div>
      <div id="cajas-recientes"></div>
    </aside>

    <main class="app-main">
      <!-- Vue monta las vistas de datos aquí; jQuery no toca este bloque -->
      <div id="app"></div>
    </main>

    <footer class="app-footer">Cosigna &middot; tesorerías colectivas con aprobación compartida</footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
